name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Build and validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION;
          const registryPath = 'registry/server.json';
          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          registry.version = version;
          for (const pkg of registry.packages ?? []) {
            if (pkg.identifier === 'skill-deck') {
              pkg.version = version;
            }
          }
          fs.writeFileSync(registryPath, `${JSON.stringify(registry, null, 2)}\n`);
          NODE
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Run release checks
        run: npm run release:check

      - name: Verify npm package contents
        run: npm run pack:dry-run

      - name: Download MCP Registry publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate registry/server.json

      - name: Show release metadata
        run: |
          node -e "const pkg=require('./package.json'); console.log({ name: pkg.name, version: pkg.version, bin: pkg.bin, files: pkg.files })"
          node -e "const registry=require('./registry/server.json'); console.log({ registryName: registry.name, version: registry.version, package: registry.packages[0].identifier })"

  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION;
          const registryPath = 'registry/server.json';
          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          registry.version = version;
          for (const pkg of registry.packages ?? []) {
            if (pkg.identifier === 'skill-deck') {
              pkg.version = version;
            }
          }
          fs.writeFileSync(registryPath, `${JSON.stringify(registry, null, 2)}\n`);
          NODE
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: |
          if npm view "skill-deck@${{ inputs.version }}" version >/dev/null 2>&1; then
            echo "skill-deck@${{ inputs.version }} already exists on npm; skipping npm publish."
          else
            npm publish --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-registry:
    name: Publish MCP Registry entry
    runs-on: ubuntu-latest
    needs: publish-npm
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set registry version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION;
          const registryPath = 'registry/server.json';
          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          registry.version = version;
          for (const pkg of registry.packages ?? []) {
            if (pkg.identifier === 'skill-deck') {
              pkg.version = version;
            }
          }
          fs.writeFileSync(registryPath, `${JSON.stringify(registry, null, 2)}\n`);
          NODE
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Download MCP Registry publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish registry/server.json
